<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyless Replay</title>
<style>
:root { --bg:#f4f3ef; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#dddbd3; --accent:#2f6fb0; --ok:#2e7d4f; --bad:#b3402e; --scene:#e9e7e0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161615; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9a9890; --line:#34332f; --accent:#6fa6dd; --ok:#5bb37f; --bad:#e0705d; --scene:#262624; } }
:root[data-theme="dark"] { --bg:#161615; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9a9890; --line:#34332f; --accent:#6fa6dd; --ok:#5bb37f; --bad:#e0705d; --scene:#262624; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display:grid; grid-template-columns: 1fr 330px; grid-template-rows: 1fr auto; height:100vh; }
#view { position:relative; background:var(--scene); min-width:0; }
aside { grid-row: 1 / span 2; grid-column: 2; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px 16px; }
#bar { grid-column:1; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; }
h1 { font-size:15px; margin:0 0 4px; } h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; font-weight:600; }
#phase { font-weight:600; } #label { color:var(--muted); }
input[type=range] { width:100%; accent-color:var(--accent); }
button, select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.leg div { margin:6px 0; } .leg b { font-weight:600; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
#phases span { display:inline-block; padding:1px 7px; border-radius:9px; border:1px solid var(--line); margin:2px 3px 2px 0; cursor:pointer; font-size:12px; }
#phases span.on { background:var(--accent); color:#fff; border-color:var(--accent); }
@media (max-width: 900px) { #app { grid-template-columns:1fr; grid-template-rows: 60vh auto auto; height:auto; } aside { grid-row:auto; grid-column:1; border-left:0; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="bar">
    <div class="row" style="justify-content:space-between">
      <div><span id="phase"></span> <span id="label"></span></div>
      <div class="row"><button id="play">Play</button>
        <select id="speed"><option value="1">1x</option><option value="3" selected>3x</option><option value="8">8x</option></select>
        <span id="fno" style="color:var(--muted)"></span></div>
    </div>
    <input id="t" type="range" min="0" max="0" step="1" value="0">
    <div id="phases"></div>
  </div>
  <aside>
    <h1 id="title"></h1>
    <div id="score" style="color:var(--muted)"></div>
    <h2>Acceptance steps (grader's result)</h2>
    <div id="at"></div>
    <h2>What each part does</h2>
    <div class="leg" id="legend"></div>
    <h2>Note</h2>
    <div style="color:var(--muted)">Every part moves exactly as the grader's contact simulation moved it, step by step. Plates are drawn see-through. Drag to orbit, scroll to zoom.</div>
  </aside>
</div>
